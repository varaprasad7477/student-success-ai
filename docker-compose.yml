services:
  dashboard:
    build: .
    ports: ["8501:8501"]
    volumes: ["student-data:/app/data", "student-models:/app/models"]
  api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment:
      STUDENT_SUCCESS_API_KEY: ${STUDENT_SUCCESS_API_KEY:-change-before-use}
    volumes: ["student-data:/app/data", "student-models:/app/models"]
volumes:
  student-data:
  student-models:

